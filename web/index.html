<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="description" content="查询两站之间用时最短或里程最短的列车换乘方案。">
  <title>行间 - 列车路径规划</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<svg hidden>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3ZM9 3 5 6.99h3V14h2V6.99h3L9 3Z"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5Z"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6-1.41-1.41Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17Z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1ZM8 13h8v-2H8v2Zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5Z"/></symbol>
  <symbol id="i-train" viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2.23l2-2H14l2 2h2v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4ZM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17Zm3.5-7H6V6h5v4Zm2 0V6h5v4h-5Zm3.5 7c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5Z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Zm0 18H4V10h16v11Zm0-13H4V5h16v3Z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12l4.58-4.59Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6Z"/></symbol>
  <symbol id="i-schedule" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2ZM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8Zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7Z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><path d="M11 7h2v2h-2V7Zm0 4h2v6h-2v-6Zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8Z"/></symbol>
  <symbol id="i-transfer" viewBox="0 0 24 24"><path d="m18 12 4-4-4-4v3H3v2h15v3ZM6 12l-4 4 4 4v-3h15v-2H6v-3Z"/></symbol>
</svg>
<header class="app-bar">
  <h1>行间 <span class="dash">-</span> 列车路径规划</h1>
  <span id="version"></span>
</header>
<div class="layout">
  <form id="form" class="pane" novalidate>
    <div class="stations">
      <div class="combobox">
        <mdui-text-field id="from" variant="outlined" label="出发站" value="北京南" autocomplete="off" spellcheck="false" required></mdui-text-field>
        <mdui-menu id="from-menu" class="menu" hidden></mdui-menu>
      </div>
      <div class="combobox">
        <mdui-text-field id="to" variant="outlined" label="到达站" value="上海虹桥" autocomplete="off" spellcheck="false" required></mdui-text-field>
        <mdui-menu id="to-menu" class="menu" hidden></mdui-menu>
      </div>
      <mdui-button-icon id="swap" variant="tonal" aria-label="互换出发站和到达站"><svg><use href="#i-swap"/></svg></mdui-button-icon>
    </div>
    <div class="row">
      <mdui-dropdown id="date-field" placement="bottom-start" stay-open-on-click>
        <mdui-text-field slot="trigger" variant="outlined" label="出发日期" readonly><svg slot="end-icon"><use href="#i-calendar"/></svg></mdui-text-field>
        <div class="popover">
          <calendar-date locale="zh-CN">
            <span slot="heading"></span>
            <svg slot="previous" aria-label="上个月"><use href="#i-prev"/></svg>
            <svg slot="next" aria-label="下个月"><use href="#i-next"/></svg>
            <calendar-month></calendar-month>
          </calendar-date>
        </div>
      </mdui-dropdown>
      <mdui-dropdown id="time-field" placement="bottom-end" stay-open-on-click>
        <mdui-text-field slot="trigger" variant="outlined" label="最早出发时间" readonly><svg slot="end-icon"><use href="#i-schedule"/></svg></mdui-text-field>
        <div class="popover time-picker"></div>
      </mdui-dropdown>
    </div>
    <div class="row">
      <mdui-dropdown id="arrival-field" placement="bottom-start" stay-open-on-click>
        <mdui-text-field slot="trigger" variant="outlined" label="最晚到达日期" readonly><svg slot="end-icon"><use href="#i-calendar"/></svg></mdui-text-field>
        <div class="popover">
          <calendar-date locale="zh-CN">
            <span slot="heading"></span>
            <svg slot="previous" aria-label="上个月"><use href="#i-prev"/></svg>
            <svg slot="next" aria-label="下个月"><use href="#i-next"/></svg>
            <calendar-month></calendar-month>
          </calendar-date>
        </div>
      </mdui-dropdown>
      <mdui-dropdown id="arrival-time-field" placement="bottom-end" stay-open-on-click>
        <mdui-text-field slot="trigger" variant="outlined" label="最晚到达时间" readonly><svg slot="end-icon"><use href="#i-schedule"/></svg></mdui-text-field>
        <div class="popover time-picker"></div>
      </mdui-dropdown>
    </div>
    <div class="row">
      <mdui-select id="transfers" variant="outlined" label="最多换乘" value="2" placement="bottom">
        <mdui-menu-item value="0">不换乘</mdui-menu-item>
        <mdui-menu-item value="1">1 次</mdui-menu-item>
        <mdui-menu-item value="2">2 次</mdui-menu-item>
        <mdui-menu-item value="3">3 次</mdui-menu-item>
        <mdui-menu-item value="4">4 次</mdui-menu-item>
        <mdui-menu-item value="5">5 次</mdui-menu-item>
        <mdui-menu-item value="6">6 次</mdui-menu-item>
        <mdui-menu-item value="7">7 次</mdui-menu-item>
        <mdui-menu-item value="8">8 次</mdui-menu-item>
        <svg slot="end-icon"><use href="#i-drop"/></svg>
      </mdui-select>
      <mdui-text-field id="buffer" variant="outlined" label="最少换乘时间" type="number" min="0" max="720" step="1" value="15" inputmode="numeric" suffix="分钟" required></mdui-text-field>
    </div>
    <mdui-dropdown id="types-field" placement="bottom-start" stay-open-on-click>
      <mdui-text-field slot="trigger" variant="outlined" label="车次类型" readonly><svg slot="end-icon"><use href="#i-drop"/></svg></mdui-text-field>
      <mdui-menu id="types-menu" selects="multiple">
        <mdui-menu-item value="all">全部车次</mdui-menu-item>
        <mdui-menu-item value="plain">仅普速列车</mdui-menu-item>
        <mdui-divider></mdui-divider>
        <mdui-menu-item value="G">G 高铁</mdui-menu-item>
        <mdui-menu-item value="D">D 动车</mdui-menu-item>
        <mdui-menu-item value="C">C 城际</mdui-menu-item>
        <mdui-menu-item value="Z">Z 直达</mdui-menu-item>
        <mdui-menu-item value="T">T 特快</mdui-menu-item>
        <mdui-menu-item value="K">K 快速</mdui-menu-item>
        <mdui-menu-item value="O">其他</mdui-menu-item>
      </mdui-menu>
    </mdui-dropdown>
    <div class="row city">
      <label class="switch"><mdui-switch id="city" checked-icon=""></mdui-switch>同城换乘</label>
      <mdui-text-field id="city-buffer" variant="outlined" label="同城换乘时间" type="number" min="0" max="720" step="1" value="60" inputmode="numeric" suffix="分钟" required hidden disabled></mdui-text-field>
    </div>
    <div class="actions">
      <div class="switches">
        <label class="switch"><mdui-switch id="strict" checked-icon=""></mdui-switch>严格校验</label>
        <label class="switch"><mdui-switch id="fares" checked-icon=""></mdui-switch>查询票价</label>
      </div>
      <mdui-button id="submit" type="submit" disabled>加载中</mdui-button>
    </div>
  </form>

  <section class="results">
    <div id="results-bar" class="results-bar" hidden>
      <mdui-segmented-button-group id="mode" selects="single" value="fastest" aria-label="优先条件">
        <mdui-segmented-button value="fastest">用时最短</mdui-segmented-button>
        <mdui-segmented-button value="shortest">里程最短</mdui-segmented-button>
      </mdui-segmented-button-group>
      <mdui-button id="share" variant="text"><svg slot="icon"><use href="#i-link"/></svg><span>复制链接</span></mdui-button>
    </div>
    <div id="custom-notice" class="notice" hidden>
      <svg aria-hidden="true"><use href="#i-info"/></svg><span></span>
      <mdui-button id="custom-reset" variant="text">重置</mdui-button>
    </div>
    <div id="result" aria-live="polite"><div class="placeholder"><svg><use href="#i-train"/></svg></div></div>
  </section>
</div>
<mdui-dialog id="update-dialog" headline="时刻表有更新">
  <span slot="description" id="update-detail"></span>
  <mdui-button slot="action" variant="text" id="update-later">稍后</mdui-button>
  <mdui-button slot="action" variant="text" id="update-confirm">更新</mdui-button>
</mdui-dialog>
<mdui-snackbar id="snackbar" auto-close-delay="2400"></mdui-snackbar>
<noscript>需要启用 JavaScript</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
