name: Probe lltskb

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reach lltskb from GitHub Actions
        run: |
          for url in http://down.lltskb.com/android.ver http://down.lltskb.com/an.db http://223.107.87.50:8011/an.db; do
            curl -sS -o /dev/null --connect-timeout 20 -m 180 \
              -w "$url  status=%{http_code}  connect=%{time_connect}s  total=%{time_total}s  size=%{size_download}\n" "$url" \
              || echo "$url  failed"
          done
